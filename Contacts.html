    <form action="#" method="post"
        style="border: 1px solid;background-color: #f7f7f4; padding:10px 20px 10px 0px; margin-bottom: 10px; box-sizing: border-box; max-width: 500px; width: 100%;">
        <label for="" style="font-weight: bold; color: #2b2b2b; display: block; ">Enter Your Name:</label><br>
        <input type="text"
            style="box-sizing: border-box; border: 1px solid #c0504d; background-color: #fff;"><br>

            style="box-sizing: border-box; border: 1px solid #c0504d; background-color: #fff;"><br>

        <label for="Subject" style="font-weight: bold; color: #2b2b2b;  display: block; ">Message Subject:</label><br>
        <input type="text"
            style="box-sizing: border-box; border: 1px solid #c0504d; background-color: #fff;"><br>

        <label for="Message" style="font-weight: bold; color: #2b2b2b; display: block; ">Enter Your Mesage*:</label><br>
        <textarea name="Message" required
            style="box-sizing: border-box; border: 1px solid #c0504d; padding: 2px; resize: both;"></textarea><br>

        <input type="checkbox" >
        <label for="checkbox" style="font-weight: bold; color: #2b2b2b; display: block; ">E-mail a copy of this message to your own
            address.</label><br>

        <button type="submit"
            style="background-color: #2e8b2e; color: #fff; font-weight: bold; border: none; cursor: pointer;">send</button>
